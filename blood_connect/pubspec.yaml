name: blood_connect
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/blood_connect_logo.png

flutter_launcher_icons:
  image_path: "assets/images/blood_connect_logo.png"
  android: true
  ios: true

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/blood_connect_logo.png"
  android: true
  ios: true
